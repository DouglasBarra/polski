<!DOCTYPE html>
<!--
  OWNER: director. Builder agents do not edit this file.

  CONTRACT (full text in CONTRACT.md):
  - Works from file://. Classic scripts only, no ES modules, one global: window.Iskry.
  - Script order is fixed: data/words.js, js/memory.js, js/card.js, js/scene.js, inline boot.

  DOM HOOKS
  Scene agent owns everything inside #scene. It may add children to the three layers only:
    #scene-strings  guitar-string lines (aria-hidden)
    #scene-words    floating words, each <button type="button" class="spark" data-id="...">
    #scene-fire     firelight glow (aria-hidden)
  Card agent owns everything inside #card-root (empty here; card.js builds it):
    #card-root[hidden][data-state="closed|opening|open|closing"]
    .card-root__backdrop, .card, .card__close, .card__word, .card__respelling, .card__meaning,
    .card__example-pl, .card__example-en, .card__family, .card__family-item[data-id]
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iskry</title>
  <meta name="description" content="Polish words rising like sparks from a fire. Catch one.">
  <meta name="theme-color" content="#1a120d">

  <!-- Fonts: Fraunces for Polish words, Lora italic for English. Both need latin-ext. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Lora:ital,wght@0,400..600;1,400..600&display=swap&subset=latin-ext" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <h1 class="visually-hidden">Iskry: Polish words by the fire</h1>

  <main id="scene" class="scene" aria-label="Polish words rising from a fire. Choose a word to see what it means.">
    <div id="scene-strings" class="scene__strings" aria-hidden="true"></div>
    <div id="scene-words" class="scene__words"></div>
    <div id="scene-fire" class="scene__fire" aria-hidden="true"></div>
  </main>

  <div id="card-root" class="card-root" data-state="closed" hidden></div>

  <noscript><p class="noscript">Iskry needs JavaScript to let the words rise.</p></noscript>

  <script src="data/words.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/card.js"></script>
  <script src="js/scene.js"></script>
  <script>
    (function () {
      "use strict";
      var Iskry = window.Iskry || {};
      var words = Iskry.WORDS || [];
      var wordsById = {};
      for (var i = 0; i < words.length; i++) wordsById[words[i].id] = words[i];
      Iskry.card.init(document.getElementById("card-root"), wordsById);
      Iskry.scene.init(document.getElementById("scene"), words);
    })();
  </script>
</body>
</html>
