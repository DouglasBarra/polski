<!DOCTYPE html>
<!--
  OWNER: director. Builder agents do not edit this file.

  CONTRACT (full text in CONTRACT.md):
  - Served over http (python3 -m http.server 8765), not file://: the scene is an ES module.
  - three.js r186 (0.186.1) is vendored in vendor/three/ and resolved by the import map below.
    Nothing is fetched from a CDN except the two web fonts.
  - data/words.js, js/memory.js and js/card.js are classic scripts on window.Iskry.
    js/scene.js is an ES module; the inline module at the bottom boots both.

  DOM HOOKS
  Scene owns everything inside #scene. It adds children to the two layers only:
    #scene-world    the WebGL canvas: night, fire, strings (aria-hidden)
    #scene-words    the CSS3D layer; each word is <button type="button" class="spark" data-id="...">
  Card agent owns everything inside #card-root (empty here; card.js builds it):
    #card-root[hidden][data-state="closed|opening|open|closing"]
    .card-root__backdrop, .card, .card__close, .card__word, .card__respelling, .card__meaning,
    .card__example-pl, .card__example-en, .card__family, .card__family-item[data-id]
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iskry</title>
  <meta name="description" content="Polish words drifting on the night wind past a fire. Catch one.">
  <meta name="theme-color" content="#1a120d">
  <link rel="icon" href="data:,">

  <!-- Fonts: Fraunces for Polish words, Lora italic for English. Both need latin-ext. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Lora:ital,wght@0,400..600;1,400..600&display=swap&subset=latin-ext" rel="stylesheet">

  <!-- three.js 0.186.1, vendored. Bare "three" imports resolve here (must precede any module). -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <h1 class="visually-hidden">Iskry: Polish words by the fire</h1>

  <main id="scene" class="scene" aria-label="Polish words drifting on the night wind past a fire. Choose a word to see what it means.">
    <div id="scene-world" class="scene__world" aria-hidden="true"></div>
    <div id="scene-words" class="scene__words"></div>
  </main>

  <div id="card-root" class="card-root" data-state="closed" hidden></div>

  <noscript><p class="noscript">Iskry needs JavaScript to let the words drift.</p></noscript>

  <script src="data/words.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/card.js"></script>
  <script type="module">
    import { init as initScene } from "./js/scene.js";
    const Iskry = window.Iskry || {};
    const words = Iskry.WORDS || [];
    const wordsById = {};
    for (const w of words) wordsById[w.id] = w;
    Iskry.card.init(document.getElementById("card-root"), wordsById);
    initScene(document.getElementById("scene"), words);
  </script>
</body>
</html>
