<!DOCTYPE html>
<!--
  Iskry · dev/foreground.html — standalone test bench for js/scene/foreground.js.
  Serve the repo root (python3 -m http.server) and open /dev/foreground.html.
  Uses the real camera, and the real sky.js / fire.js / trees.js when they load (guarded);
  otherwise a stand-in fire light, a flat dark ground and the core's fog.
  URL params: ?rm=1 (reduced motion) &nosky=1 &nofire=1 &notrees=1 &band=1 (shows the words' band)
              &labels=0 (no placeholder words) &cam=stork|shrine (close looks) &gain=N
              &play=preen|clatter|shift|stretch|flight (start a stork behaviour; also fg.stork.play(name))
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iskry · foreground bench</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&display=swap&subset=latin-ext" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; }
    #gl, #css { position: fixed; inset: 0; }
    #css { pointer-events: none; }
    .lbl { font-family: var(--font-pl); font-size: 26px; color: var(--ember); white-space: nowrap; }
    #band { position: fixed; left: 0; right: 0; top: 8%; height: 54%; border-top: 1px dashed #6b554355; border-bottom: 1px dashed #6b554355; pointer-events: none; display: none; }
    #hud { position: fixed; left: 10px; bottom: 8px; font: 11px ui-monospace, monospace; color: #6b5543; }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "../vendor/three/three.module.js",
        "three/addons/": "../vendor/three/addons/"
    } }
  </script>
</head>
<body>
  <div id="gl"></div>
  <div id="css"></div>
  <div id="band"></div>
  <div id="hud"></div>
  <script type="module">
    import * as THREE from 'three';
    import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
    import { createForeground } from '../js/scene/foreground.js';

    const q = new URLSearchParams(location.search);
    window.__errors = [];
    addEventListener('error', (e) => window.__errors.push(String(e.message)));
    if (q.get('band') === '1') document.getElementById('band').style.display = 'block';

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    document.getElementById('gl').appendChild(renderer.domElement);
    if (q.has('gain')) renderer.domElement.style.filter = `brightness(${+q.get('gain') || 4})`;
    const cssR = new CSS3DRenderer();
    cssR.setSize(innerWidth, innerHeight);
    document.getElementById('css').appendChild(cssR.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 400);
    const cam = q.get('cam');
    if (cam === 'stork') { camera.fov = 22; camera.updateProjectionMatrix(); camera.position.set(-13.2, 7.3, -14.6); camera.lookAt(-15.85, 7.25, -19); }
    else if (cam === 'storkwide') { camera.position.set(-9.5, 6.8, -5.5); camera.lookAt(-16.5, 8.2, -21); }
    else if (cam === 'shrine') { camera.position.set(1.4, 1.75, 0.6); camera.lookAt(3.3, 1.55, -3.2); }
    else { camera.position.set(0, 1.6, 12); camera.lookAt(0, 4.1, -10); }
    scene.fog = new THREE.Fog(new THREE.Color('#301d11'), 14, 72);   // the core applies sky.js's suggestion

    const css = getComputedStyle(document.documentElement);
    const readToken = (name, fallback) => {
      const v = css.getPropertyValue(name).trim();
      if (!v) return fallback;
      const n = parseFloat(v);
      return /^-?[\d.]+(ms|px)?$/.test(v) && !isNaN(n) ? n : v;
    };
    const ctx = { scene, camera, renderer, reducedMotion: q.get('rm') === '1', readToken };
    const firePos = new THREE.Vector3(-3, 0, -2);
    const mods = {};
    const tryLoad = async (name, factory, opts) => {
      try { const m = await import(`../js/scene/${name}.js`); mods[name] = m[factory](ctx, opts); }
      catch (e) { console.warn('dev: ' + name + ' unavailable', e); }
    };

    // sky first (behind everything), else a flat dark ground
    if (q.get('nosky') !== '1') await tryLoad('sky', 'createSky', { horizonY: 0, radius: 90 });
    if (mods.sky && mods.sky.fogColor) { scene.fog.color.copy(mods.sky.fogColor); scene.fog.near = mods.sky.fogNear; scene.fog.far = mods.sky.fogFar; }
    if (!mods.sky) {
      renderer.setClearColor(new THREE.Color(readToken('--night', '#1a120d')), 1);
      const ground = new THREE.Mesh(new THREE.CircleGeometry(89, 96).rotateX(-Math.PI / 2).translate(0, 0, 12),
        new THREE.MeshBasicMaterial({ color: '#0d0806', fog: true, depthWrite: false }));
      ground.renderOrder = -45; scene.add(ground);
    }
    if (q.get('notrees') !== '1') await tryLoad('trees', 'createTrees', { firePosition: firePos.clone() });
    if (q.get('nofire') !== '1') await tryLoad('fire', 'createFire', { position: firePos.clone(), scale: 1.3 });
    if (!mods.fire) {   // stand-in fire light, like fire.js's
      const l = new THREE.PointLight('#ff9a45', 26, 40, 1.35); l.position.set(firePos.x, 1.17, firePos.z); scene.add(l);
    }

    const fg = createForeground(ctx, { firePosition: firePos.clone(), wind: 0.25 });
    if (q.get('play')) setTimeout(() => fg.stork.play(q.get('play')), 600);
    window.fg = fg; window.__dev = { THREE, scene, camera, renderer, ctx, mods, createForeground };

    // placeholder words across the band, to judge legibility over the foreground
    const words = [['iskra', -4, 3.2, 2], ['ognisko', 3.5, 5.0, -4], ['gwiazda', -6, 7.5, -9], ['las', 6, 9.6, -14], ['noc', -9, 10.4, -14], ['bocian', -8.5, 7.6, -12], ['księżyc', 1, 2.2, 2], ['płot', 5.5, 3.3, 0]];
    if (q.get('labels') !== '0') for (const [t, x, y, z] of words) {
      const el = document.createElement('div'); el.className = 'lbl'; el.textContent = t;
      const o = new CSS3DObject(el); o.position.set(x, y, z); o.scale.setScalar(0.02); scene.add(o);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight); cssR.setSize(innerWidth, innerHeight);
      for (const k in mods) mods[k].resize && mods[k].resize(innerWidth, innerHeight);
      fg.resize(innerWidth, innerHeight);
    });

    // rebuild (as the core does when reduced motion changes) to check dispose()
    window.rebuild = (rm) => { window.fg.dispose(); ctx.reducedMotion = !!rm; window.fg = createForeground(ctx, { firePosition: firePos.clone(), wind: 0.25 }); return renderer.info.memory; };

    // CPU cost of fg.update and GPU cost estimate with / without the foreground
    window.measure = () => {
      const gl = renderer.getContext();
      const timeRender = (vis) => {
        window.fg.group.visible = vis; gl.finish();
        const a = performance.now();
        for (let i = 0; i < 30; i++) { window.fg.update(i * 0.016, 0.016); renderer.render(scene, camera); }
        gl.finish(); window.fg.group.visible = true; return (performance.now() - a) / 30;
      };
      timeRender(true);
      const withFg = timeRender(true), without = timeRender(false);
      let u = performance.now(); for (let i = 0; i < 1000; i++) window.fg.update(i * 0.016, 0.016); u = (performance.now() - u) / 1000;
      renderer.render(scene, camera);
      return { renderWithMs: +withFg.toFixed(3), renderWithoutMs: +without.toFixed(3), updateMs: +u.toFixed(5),
               calls: renderer.info.render.calls, tris: renderer.info.render.triangles, memory: renderer.info.memory,
               size: [innerWidth, innerHeight, renderer.getPixelRatio()], layout: window.fg.layout, errors: window.__errors };
    };

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(0.1, clock.getDelta()), t = clock.elapsedTime;
      for (const k in mods) mods[k].update(t, dt);
      window.fg.update(t, dt);
      renderer.render(scene, camera);
      cssR.render(scene, camera);
    });
    document.getElementById('hud').textContent = 'foreground · ' + Object.keys(mods).join(', ') + (mods.fire ? '' : ' (stand-in fire light)');
  </script>
</body>
</html>
