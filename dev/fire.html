<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iskry dev: fire</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; }
    canvas { display: block; }
    #hud { position: fixed; left: 12px; top: 10px; font: 12px/1.5 monospace; color: var(--muted); opacity: .75; pointer-events: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }
  </script>
</head>
<body>
  <div id="hud">fire · drag to orbit · ?view=real|side|close|top|low · ?occluder · ?props · ?bench · ?fg (foreground module)
    · ?reduced · ?scale= · ?dpr= · ?t= · ?freeze · ?nofire · ?hide=glow,flame,embers,logs,coals · ?only=flame<br><span id="ms"></span></div>
  <script type="module">
    import * as THREE from 'three';
    import { createFire } from '../js/scene/fire.js';
    import { FIRE as FIRE_POS, BENCH } from '../js/scene/layout.js';

    // a tiny orbit (drag: orbit, wheel: dolly), no addon needed
    class Orbit {
      constructor(cam, el) {
        this.cam = cam; this.target = new THREE.Vector3(); this.sph = new THREE.Spherical();
        let down = null;
        el.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; el.setPointerCapture(e.pointerId); });
        el.addEventListener('pointerup', () => { down = null; });
        el.addEventListener('pointermove', (e) => {
          if (!down) return;
          this.sph.theta -= (e.clientX - down[0]) * 0.005; this.sph.phi -= (e.clientY - down[1]) * 0.005;
          this.sph.phi = Math.min(Math.PI - 0.05, Math.max(0.05, this.sph.phi));
          down = [e.clientX, e.clientY]; this.apply();
        });
        el.addEventListener('wheel', (e) => { this.sph.radius *= Math.exp(e.deltaY * 0.001); this.apply(); }, { passive: true });
      }
      sync() { this.sph.setFromVector3(this.cam.position.clone().sub(this.target)); this.apply(); }
      apply() { this.cam.position.setFromSpherical(this.sph).add(this.target); this.cam.lookAt(this.target); }
      update() {}
    }

    window.__errors = [];
    window.addEventListener('error', (e) => window.__errors.push(String(e.message)));
    const q = new URLSearchParams(location.search);
    const css = getComputedStyle(document.documentElement);
    const readToken = (name, fallback) => {
      const v = css.getPropertyValue(name).trim();
      if (!v) return fallback;
      const n = parseFloat(v);
      return typeof fallback === 'number' && Number.isFinite(n) ? n : v;
    };

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping;
    renderer.setPixelRatio(parseFloat(q.get('dpr')) || Math.min(2, devicePixelRatio));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(new THREE.Color(readToken('--night', '#1a120d')));
    document.body.appendChild(renderer.domElement);

    const FIRE = new THREE.Vector3(FIRE_POS.x, FIRE_POS.y, FIRE_POS.z), SCALE = parseFloat(q.get('scale') || 1.3);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 450);
    scene.fog = new THREE.Fog(new THREE.Color('#2a1b12'), 14, 72);   // what sky.js suggests at night

    // views: the real camera, and off-axis ones around the fire
    const VIEWS = {
      real: [[0, 1.6, 12], [0, 4.1, -10]],
      side: [[5.5, 1.3, -1.2], [-3, 1.1, -2]],
      close: [[-1.6, 1.0, 1.4], [-3, 0.7, -2]],
      top: [[-1.0, 6.5, 3.5], [-3, 0.5, -2]],
      low: [[-3.3, 0.35, 3.2], [-3, 1.0, -2]],
      back: [[-6.5, 1.8, -8.5], [-3, 1.0, -2]],
    };
    const view = VIEWS[q.get('view')] ? q.get('view') : 'real';
    camera.position.fromArray(VIEWS[view][0]);
    const controls = new Orbit(camera, renderer.domElement);
    controls.target.fromArray(VIEWS[view][1]);
    controls.sync();

    // stand-in ground (lit, like the foreground's ground cover will be) and props
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200),
      new THREE.MeshLambertMaterial({ color: 0x3a2a1e }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);
    scene.add(new THREE.HemisphereLight(0x1c1a26, 0x0a0705, 0.5));
    const pale = new THREE.MeshLambertMaterial({ color: 0xcdbca4 });
    const wood = new THREE.MeshLambertMaterial({ color: 0x6a4a30 });
    if (q.has('props')) for (let i = -2; i <= 2; i++) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.4, 24, 16), pale);
      s.position.set(FIRE.x + i * 3, 0.4, FIRE.z - 3 + Math.abs(i) * 1.5); scene.add(s);
    }
    if (q.has('bench') || q.has('props')) {   // the foreground's log bench, just beyond the fire
      const b = new THREE.Mesh(new THREE.CylinderGeometry(BENCH.radius, BENCH.radius, BENCH.length, 16), wood);
      b.geometry.rotateZ(Math.PI / 2); b.rotation.y = -Math.atan2(BENCH.dirZ, BENCH.dirX); b.position.set(BENCH.x, BENCH.radius + 0.05, BENCH.z); scene.add(b);
    }
    if (q.has('occluder')) {    // a fence post and rail between the camera and the fire
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.5, 0.16), wood);
      post.position.set(FIRE.x + 0.35, 0.75, FIRE.z + 3.2); scene.add(post);
      const rail = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.12, 0.1), wood);
      rail.position.set(FIRE.x + 0.6, 0.9, FIRE.z + 3.2); scene.add(rail);
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.45, 24, 16), pale);
      ball.position.set(FIRE.x - 1.2, 0.45, FIRE.z + 1.9); scene.add(ball);
    }

    const ctx = { scene, camera, renderer, reducedMotion: q.has('reduced') || matchMedia('(prefers-reduced-motion: reduce)').matches, readToken };
    if (q.has('fg')) {
      try {
        const { createForeground } = await import('../js/scene/foreground.js');
        window.fg = createForeground(ctx, { firePosition: FIRE.clone(), wind: 0.25 });
        ground.visible = false;
      } catch (e) { console.warn(e); }
    }
    let fire = null;
    if (!q.has('nofire')) fire = createFire(ctx, { position: FIRE.clone(), scale: SCALE, wind: 0.25 });
    if (fire && q.get('hide')) for (const n of q.get('hide').split(',')) { const c = fire.group.getObjectByName('fire-' + n); if (c) c.visible = false; }
    if (fire && q.get('only')) for (const c of fire.group.children) if (!c.isLight && c.name !== 'fire-' + q.get('only')) c.visible = false;
    window.fire = fire; window.__dev = { THREE, scene, camera, renderer, ctx, createFire, controls, VIEWS };

    addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      if (fire) fire.resize(innerWidth, innerHeight);
    });

    // GPU timing: alternate frames with the fire shown and hidden (timer queries if available)
    const gl = renderer.getContext();
    const tq = gl.getExtension('EXT_disjoint_timer_query_webgl2');
    const gpu = { on: [], off: [], cpu: [] };
    window.__gpu = gpu;
    let pending = [];
    const avg = (a) => a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN;
    window.__fireGpuMs = () => ({ ext: !!tq, on: avg(gpu.on), off: avg(gpu.off), fire: avg(gpu.on) - avg(gpu.off), cpuUpdate: avg(gpu.cpu), n: gpu.on.length });

    // burst benchmark: N renders inside one timer query, fire alone vs the same with the fire hidden
    window.__bench = (n = 30) => new Promise((res) => {
      if (!tq || !fire) return res(null);
      const others = scene.children.filter((c) => c !== fire.group && c.visible);
      const run = (show) => {
        for (const c of others) c.visible = false;
        fire.group.visible = show;
        const qq = gl.createQuery();
        gl.beginQuery(tq.TIME_ELAPSED_EXT, qq);
        for (let i = 0; i < n; i++) renderer.render(scene, camera);
        gl.endQuery(tq.TIME_ELAPSED_EXT);
        for (const c of others) c.visible = true;
        fire.group.visible = true;
        return qq;
      };
      const pairs = [];
      for (let k = 0; k < 5; k++) pairs.push([run(true), run(false)]);
      const poll = () => {
        if (!pairs.every(([a, b]) => gl.getQueryParameter(a, gl.QUERY_RESULT_AVAILABLE) && gl.getQueryParameter(b, gl.QUERY_RESULT_AVAILABLE))) return setTimeout(poll, 50);
        const ms = pairs.map(([a, b]) => (gl.getQueryParameter(a, gl.QUERY_RESULT) - gl.getQueryParameter(b, gl.QUERY_RESULT)) / 1e6 / n);
        pairs.forEach(([a, b]) => { gl.deleteQuery(a); gl.deleteQuery(b); });
        ms.sort((x, y) => x - y);
        res({ fireMsPerFrame: ms, median: ms[2], px: [renderer.domElement.width, renderer.domElement.height] });
      };
      poll();
    });

    const t0 = performance.now(); let last = t0, frameNo = 0;
    const tOffset = parseFloat(q.get('t') || 0);
    renderer.setAnimationLoop(() => {
      const now = performance.now(), dt = (now - last) / 1000; last = now;
      const t = q.has('freeze') ? tOffset : (now - t0) / 1000 + tOffset;
      controls.update();
      if (fire) {
        const a = performance.now();
        fire.update(t, dt);
        gpu.cpu.push(performance.now() - a); if (gpu.cpu.length > 300) gpu.cpu.shift();
      }
      if (window.fg) window.fg.update(t, dt);
      const measure = tq && fire && window.__measure;
      const hide = measure && (frameNo & 1);
      if (fire) fire.group.visible = !hide;
      let qu = null;
      if (measure) { qu = gl.createQuery(); gl.beginQuery(tq.TIME_ELAPSED_EXT, qu); }
      renderer.render(scene, camera);
      if (qu) { gl.endQuery(tq.TIME_ELAPSED_EXT); pending.push([qu, hide]); }
      if (fire) fire.group.visible = true;
      pending = pending.filter(([qq, h]) => {
        if (!gl.getQueryParameter(qq, gl.QUERY_RESULT_AVAILABLE)) return true;
        if (!gl.getParameter(tq.GPU_DISJOINT_EXT)) {
          const ms = gl.getQueryParameter(qq, gl.QUERY_RESULT) / 1e6;
          const arr = h ? gpu.off : gpu.on; arr.push(ms); if (arr.length > 240) arr.shift();
        }
        gl.deleteQuery(qq);
        return false;
      });
      frameNo++;
      if (frameNo % 30 === 0 && window.__measure) {
        const r = window.__fireGpuMs();
        document.getElementById('ms').textContent = `gpu frame ${r.on.toFixed(2)} ms, fire ${r.fire.toFixed(2)} ms`;
      }
    });
  </script>
</body>
</html>
