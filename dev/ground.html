<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iskry dev: ground</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; }
    canvas { display: block; }
    #hud { position: fixed; left: 12px; top: 10px; font: 12px/1.5 monospace; color: var(--muted); opacity: .75; pointer-events: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }
  </script>
</head>
<body>
  <div id="hud">ground · drag to orbit, wheel to dolly · ?view=real|fire|ash|leaves|bench|top|road|far|left · ?hour=5.5
    · ?with=trees,road,grass,fence,log,foreground (other modules, if present) · ?nosky · ?nofire · ?noground · ?bright · ?reduced · ?dpr=<br><span id="ms"></span></div>
  <script type="module">
    import * as THREE from 'three';
    import { createGround } from '../js/scene/ground.js';
    import { FIRE as FIRE_POS, CAMERA } from '../js/scene/layout.js';

    class Orbit {
      constructor(cam, el) {
        this.cam = cam; this.target = new THREE.Vector3(); this.sph = new THREE.Spherical();
        let down = null;
        el.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; el.setPointerCapture(e.pointerId); });
        el.addEventListener('pointerup', () => { down = null; });
        el.addEventListener('pointermove', (e) => {
          if (!down) return;
          this.sph.theta -= (e.clientX - down[0]) * 0.005; this.sph.phi -= (e.clientY - down[1]) * 0.005;
          this.sph.phi = Math.min(Math.PI - 0.05, Math.max(0.05, this.sph.phi));
          down = [e.clientX, e.clientY]; this.apply();
        });
        el.addEventListener('wheel', (e) => { this.sph.radius *= Math.exp(e.deltaY * 0.001); this.apply(); }, { passive: true });
      }
      sync() { this.sph.setFromVector3(this.cam.position.clone().sub(this.target)); this.apply(); }
      apply() { this.cam.position.setFromSpherical(this.sph).add(this.target); this.cam.lookAt(this.target); }
    }

    window.__errors = [];
    window.addEventListener('error', (e) => window.__errors.push(String(e.message)));
    const q = new URLSearchParams(location.search);
    const css = getComputedStyle(document.documentElement);
    const readToken = (name, fallback) => {
      const v = css.getPropertyValue(name).trim();
      if (!v) return fallback;
      const n = parseFloat(v);
      return typeof fallback === 'number' && Number.isFinite(n) ? n : v;
    };

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping;
    renderer.setPixelRatio(parseFloat(q.get('dpr')) || Math.min(2, devicePixelRatio));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(new THREE.Color(readToken('--night', '#1a120d')), 0);
    document.body.appendChild(renderer.domElement);

    const FIRE = new THREE.Vector3(FIRE_POS.x, FIRE_POS.y, FIRE_POS.z);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 450);
    scene.fog = new THREE.Fog(new THREE.Color('#301d11'), 14, 72);

    // views: [position, target]. 'real' is the site's camera (pitched up ~6.5 deg).
    const pitch = 6.5 * Math.PI / 180;
    const VIEWS = {
      real: [[CAMERA.x, CAMERA.y, CAMERA.z], [CAMERA.x, CAMERA.y + Math.tan(pitch) * 20, CAMERA.z - 20]],
      fire: [[-1.2, 1.25, 1.6], [-3, 0.1, -2]],
      ash: [[-2.2, 0.75, 0.2], [-3, 0.0, -1.6]],
      leaves: [[-5.4, 0.7, 1.2], [-5.6, 0.0, -0.4]],
      bench: [[0.4, 1.3, -0.4], [-1.6, 0.1, -3.6]],
      top: [[-2.5, 7.5, 3.5], [-2.5, 0, -2.5]],
      road: [[1.6, 1.0, 6.5], [1.0, 0.0, 2.0]],
      far: [[0, 4.5, 14], [0, 0, -10]],
      left: [[-6.0, 1.0, 4.0], [-9.6, 0.0, -3.4]],
    };
    const view = VIEWS[q.get('view')] ? q.get('view') : 'real';
    camera.position.fromArray(VIEWS[view][0]);
    const controls = new Orbit(camera, renderer.domElement);
    controls.target.fromArray(VIEWS[view][1]);
    controls.sync();
    if (q.has('bright')) scene.add(new THREE.HemisphereLight(0x8899aa, 0x332211, 1.2));   // inspection only

    const reduced = q.has('reduced') || matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ctx = { scene, camera, renderer, reducedMotion: reduced, readToken };
    const mods = {};
    window.__mods = mods;
    async function load(name, factory, opts) {
      try {
        const mod = await import(`../js/scene/${name}.js`);
        mods[name] = mod[factory](ctx, opts);
        if (mods[name].resize) mods[name].resize(innerWidth, innerHeight);
      } catch (e) { console.warn('dev: module ' + name + ' unavailable', e); }
    }
    const cap = (s) => s[0].toUpperCase() + s.slice(1);
    if (!q.has('nosky')) await load('sky', 'createSky', { horizonY: 0, radius: 90 });
    if (mods.sky && mods.sky.fogColor) { scene.fog.color.copy(mods.sky.fogColor); scene.fog.near = mods.sky.fogNear; scene.fog.far = mods.sky.fogFar; }
    if (!q.has('noground')) {
      const a = performance.now();
      mods.ground = createGround(ctx, { firePosition: FIRE.clone(), wind: 0.25 });
      mods.ground.stats.wallMs = Math.round(performance.now() - a);
      if (q.has('debug')) { const m = mods.ground.group.getObjectByName('ground-floor').material; m.defines = { GROUND_DEBUG: q.get('debug') }; m.needsUpdate = true; }
    }
    for (const name of (q.get('with') || '').split(',').filter(Boolean)) {
      await load(name, 'create' + cap(name), { firePosition: FIRE.clone(), wind: 0.25 });
    }
    if (!q.has('nofire')) await load('fire', 'createFire', { position: FIRE.clone(), scale: 1.3, wind: 0.25 });

    // time of day, as js/scene.js computes it (?hour= pins it)
    const KEYS = [[0, 0, 1, 0], [3.5, 0, 1, 0], [5.5, 0, 0.3, 0.7], [7, 0, 0.2, 0.8], [9, 0.3, 0.7, 0], [16, 0.3, 0.7, 0], [17.5, 0.8, 0.2, 0], [20, 0, 1, 0], [24, 0, 1, 0]];
    function tod(h) {
      let i = 0; while (i < KEYS.length - 2 && h >= KEYS[i + 1][0]) i++;
      const a = KEYS[i], b = KEYS[i + 1], t0 = (h - a[0]) / (b[0] - a[0]), t = t0 * t0 * (3 - 2 * t0);
      return { hour: h, dusk: a[1] + (b[1] - a[1]) * t, night: a[2] + (b[2] - a[2]) * t, dawn: a[3] + (b[3] - a[3]) * t };
    }
    const hour = q.has('hour') ? parseFloat(q.get('hour')) : 22;
    const T = tod(((hour % 24) + 24) % 24);
    for (const m of Object.values(mods)) if (m && m.setTimeOfDay) m.setTimeOfDay(T);
    if (mods.sky && mods.sky.fogColor) scene.fog.color.copy(mods.sky.fogColor);
    if (mods.sky && mods.moon && mods.sky.setMoon) mods.sky.setMoon(mods.moon.direction, mods.moon.illumination || 0);

    window.__dev = { THREE, scene, camera, renderer, controls, VIEWS, mods };
    addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      for (const m of Object.values(mods)) if (m && m.resize) m.resize(innerWidth, innerHeight);
    });

    // burst benchmark: N renders with the ground shown vs hidden
    const gl = renderer.getContext();
    const tq = gl.getExtension('EXT_disjoint_timer_query_webgl2');
    window.__bench = (n = 30) => new Promise((res) => {
      if (!tq || !mods.ground) return res(null);
      const run = (show) => {
        mods.ground.group.visible = show;
        const qq = gl.createQuery();
        gl.beginQuery(tq.TIME_ELAPSED_EXT, qq);
        for (let i = 0; i < n; i++) renderer.render(scene, camera);
        gl.endQuery(tq.TIME_ELAPSED_EXT);
        mods.ground.group.visible = true;
        return qq;
      };
      const pairs = [];
      for (let k = 0; k < 5; k++) pairs.push([run(true), run(false)]);
      const poll = () => {
        if (!pairs.every(([a, b]) => gl.getQueryParameter(a, gl.QUERY_RESULT_AVAILABLE) && gl.getQueryParameter(b, gl.QUERY_RESULT_AVAILABLE))) return setTimeout(poll, 50);
        const ms = pairs.map(([a, b]) => (gl.getQueryParameter(a, gl.QUERY_RESULT) - gl.getQueryParameter(b, gl.QUERY_RESULT)) / 1e6 / n);
        pairs.forEach(([a, b]) => { gl.deleteQuery(a); gl.deleteQuery(b); });
        ms.sort((x, y) => x - y);
        res({ groundMsPerFrame: ms, median: ms[2], px: [renderer.domElement.width, renderer.domElement.height] });
      };
      poll();
    });

    const t0 = performance.now(); let last = t0;
    renderer.setAnimationLoop(() => {
      const now = performance.now(), dt = (now - last) / 1000; last = now;
      const t = (now - t0) / 1000;
      for (const m of Object.values(mods)) if (m && m.update) m.update(t, dt);
      renderer.render(scene, camera);
    });
    window.__ready = true;
  </script>
</body>
</html>
